name: Production uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check frontend and authoritative API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 15 https://xpoker.vercel.app/ >/dev/null
          curl --fail --silent --show-error --retry 2 --max-time 15 https://xpoker-api-production.up.railway.app/health/ready >ready.json
          curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H 'Origin: https://xpoker.vercel.app' \
            https://xpoker-api-production.up.railway.app/v1/beta/lobby >lobby.json
          node -e 'const fs=require("fs");const ready=JSON.parse(fs.readFileSync("ready.json"));const lobby=JSON.parse(fs.readFileSync("lobby.json"));if(ready.status!=="ready"||ready.authoritativeRuntime!=="ready")throw new Error("API is not authoritative-ready");if(lobby.fundsMove!==false||lobby.assets?.length!==10||lobby.rooms?.length!==4)throw new Error("Safe-beta contract changed");'

      - name: Open or update outage issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ops] Production uptime alert";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = data.find((issue) => issue.title === title);
            const body = `Production smoke checks failed at ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close recovered outage issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ops] Production uptime alert";
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open" });
            const existing = data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Checks recovered at ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
            }
