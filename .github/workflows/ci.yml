name: Security and correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xpoker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xpoker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/xpoker
      REDIS_URL_TEST: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: solanafoundation/anchor:v1.0.0
    steps:
      - uses: actions/checkout@v6
      - name: Configure pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy && rustup default 1.97.1
      - name: Rust unit and cross-language vectors
        working-directory: settlement
        run: cargo test --workspace --locked
      - name: Rust security lint
        working-directory: settlement
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build deployable Solana SBF artifact
        working-directory: settlement
        run: anchor build --ignore-keys
      - name: Report pinned artifact digest
        working-directory: settlement
        run: sha256sum target/deploy/xpoker_escrow.so
      - name: Preserve deployable SBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpoker-escrow-sbf
          path: settlement/target/deploy/xpoker_escrow.so
          if-no-files-found: error

  contract-runtime:
    # Agave 3.1 requires io_uring on Linux. Keep the relaxed seccomp profile
    # isolated from untrusted pull-request code and from the build job.
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: solanafoundation/anchor:v1.0.0
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v6
      - name: Restore deployable SBF artifact
        uses: actions/download-artifact@v4
        with:
          name: xpoker-escrow-sbf
          path: settlement/target/deploy
      - name: Execute SBF entrypoint in a local validator
        run: npm run smoke:contract-runtime
