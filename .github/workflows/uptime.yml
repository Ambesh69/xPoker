name: Production uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check frontend and authoritative API
        id: production_check
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 15 https://xpoker.vercel.app/ >/dev/null
          curl --fail --silent --show-error --retry 2 --max-time 15 https://xpoker-api-production.up.railway.app/health/ready >ready.json
          curl --fail --silent --show-error --retry 2 --max-time 15 https://xpoker-api-production.up.railway.app/health/ops >ops.json
          curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H 'Origin: https://xpoker.vercel.app' \
            https://xpoker-api-production.up.railway.app/v1/beta/lobby >lobby.json
          node -e 'const fs=require("fs");const ready=JSON.parse(fs.readFileSync("ready.json"));const ops=JSON.parse(fs.readFileSync("ops.json"));const lobby=JSON.parse(fs.readFileSync("lobby.json"));if(ready.status!=="ready"||ready.authoritativeRuntime!=="ready")throw new Error("API is not authoritative-ready");if(ops.status!=="healthy"||ops.failed?.length)throw new Error(`Operational probes degraded: ${(ops.failed||[]).join(",")}`);if(lobby.fundsMove!==false||lobby.assets?.length!==10||lobby.rooms?.length!==4)throw new Error("Safe-beta contract changed");'

      - name: Open outage issue once
        if: steps.production_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ops] Production uptime alert";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = data.find((issue) => issue.title === title);
            const body = `Production or operational-health checks failed at ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nRunbook: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/docs/INCIDENT-RESPONSE.md`;
            if (existing) {
              core.warning(`Production remains degraded; tracking in issue #${existing.number}.`);
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Summarize degraded status without notification spam
        if: steps.production_check.outcome == 'failure'
        run: |
          echo "::warning::Production check failed; the existing outage issue remains authoritative."
          echo "### Production check degraded" >> "$GITHUB_STEP_SUMMARY"
          echo "The outage is tracked in the single open ops issue. Scheduled runs intentionally remain successful to avoid repeated failure emails." >> "$GITHUB_STEP_SUMMARY"

      - name: Close recovered outage issue
        if: steps.production_check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ops] Production uptime alert";
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open" });
            const existing = data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Checks recovered at ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
            }
